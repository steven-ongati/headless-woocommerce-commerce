name: headless-woocommerce-commerce

services:
  db:
    image: mysql:8.4.6
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_PASSWORD: ${WORDPRESS_DB_PASSWORD:-local-wordpress-password}
      MYSQL_ROOT_PASSWORD: ${WORDPRESS_DB_ROOT_PASSWORD:-local-root-password}
      MYSQL_USER: wordpress
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - mysql_data:/var/lib/mysql

  wordpress:
    image: wordpress:6.8.2-php8.3-apache
    depends_on:
      db:
        condition: service_healthy
    environment:
      COMMERCE_PREVIEW_SECRET: ${COMMERCE_PREVIEW_SECRET:-local-preview-secret-change-before-sharing}
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-local-wordpress-password}
      WORDPRESS_DB_USER: wordpress
      WORDPRESS_DEBUG: "1"
      WORDPRESS_CONFIG_EXTRA: |
        define( 'WP_ENVIRONMENT_TYPE', 'local' );
        define( 'DISALLOW_FILE_EDIT', true );
        define( 'COMMERCE_PREVIEW_SECRET', getenv( 'COMMERCE_PREVIEW_SECRET' ) );
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/wp-login.php >/dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    ports:
      - "8080:80"
    volumes:
      - wordpress_data:/var/www/html
      - ./wordpress/plugins/commerce-reference:/var/www/html/wp-content/plugins/commerce-reference:ro

  wp-setup:
    image: wordpress:cli-2.12.0-php8.3
    depends_on:
      wordpress:
        condition: service_healthy
    environment:
      WORDPRESS_ADMIN_PASSWORD: ${WORDPRESS_ADMIN_PASSWORD:-local-admin-password}
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_PASSWORD: ${WORDPRESS_DB_PASSWORD:-local-wordpress-password}
      WORDPRESS_DB_USER: wordpress
    entrypoint: ["sh", "/scripts/bootstrap-wordpress.sh"]
    user: "33:33"
    volumes:
      - wordpress_data:/var/www/html
      - ./scripts:/scripts:ro
      - ./wordpress/plugins/commerce-reference:/var/www/html/wp-content/plugins/commerce-reference:ro

  redis:
    image: redis:8.2.1-alpine
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    volumes:
      - redis_data:/data

  meilisearch:
    image: getmeili/meilisearch:v1.15.2
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-local-meilisearch-key-change-before-sharing}
      MEILI_NO_ANALYTICS: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
    ports:
      - "127.0.0.1:7700:7700"
    restart: unless-stopped
    volumes:
      - meilisearch_data:/meili_data

  storefront:
    build:
      context: .
      dockerfile: apps/storefront/Dockerfile
    depends_on:
      wp-setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    environment:
      COMMERCE_OPERATIONS_SECRET: ${COMMERCE_OPERATIONS_SECRET:-local-operations-secret-change-before-sharing}
      COMMERCE_PREVIEW_SECRET: ${COMMERCE_PREVIEW_SECRET:-local-preview-secret-change-before-sharing}
      MEILISEARCH_MASTER_KEY: ${MEILISEARCH_MASTER_KEY:-local-meilisearch-key-change-before-sharing}
      MEILISEARCH_URL: http://meilisearch:7700
      NODE_ENV: production
      REDIS_URL: redis://redis:6379
      WORDPRESS_GRAPHQL_URL: http://wordpress/graphql
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    ports:
      - "3000:3000"

volumes:
  meilisearch_data:
  mysql_data:
  redis_data:
  wordpress_data:
